# Base Samba configuration for smb-share-manager.
# This file is part of the image and is never rewritten. Generated settings live in
# /data/samba/globals.conf (from environment variables) and /data/samba/shares.conf
# (from the web UI), both included at the end.

[global]
	server role = standalone server
	workgroup = WORKGROUP
	server string = smb-share-manager

	# State: persistent parts in /data, the rest on tmpfs.
	passdb backend = tdbsam:/data/samba/private/passdb.tdb
	private dir = /data/samba/private
	state directory = /data/samba/state
	lock directory = /run/samba/lock
	cache directory = /run/samba/cache
	pid directory = /run/samba
	ncalrpc dir = /run/samba/ncalrpc
	log level = 1
	max log size = 0

	# Protocol and transport security.
	server min protocol = SMB2_10
	client min protocol = SMB2_10
	server signing = desired
	server smb encrypt = desired
	ntlm auth = ntlmv2-only
	smb ports = 445 139

	# No anonymous or guest access, ever.
	map to guest = never
	restrict anonymous = 2
	guest ok = no
	usershare max shares = 0

	# No printing.
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	show add printer wizard = no

	# Never follow links out of a share.
	wide links = no
	allow insecure wide links = no
	unix extensions = no

	# macOS: vfs_fruit settings for shares on unix filesystems (the renderer loads
	# "fruit streams_xattr" there). Not loaded globally: shares on exFAT/FAT/NTFS cannot
	# store streams, and an all-exFAT server should not negotiate Apple extensions.
	fruit:aapl = yes
	fruit:metadata = stream
	fruit:model = MacSamba
	fruit:nfs_aces = no
	fruit:posix_rename = yes
	fruit:veto_appledouble = no
	fruit:wipe_intentionally_left_blank_rfork = yes
	fruit:delete_empty_adfiles = yes

	include = /data/samba/globals.conf
	include = /data/samba/shares.conf
