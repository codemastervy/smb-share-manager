# Reusable pipeline: lint + unit tests, build the image ONCE, run integration tests (exFAT and
# ext4) and Trivy against that exact image. Publishing is a separate workflow (push-image.yml)
# that pushes this same saved image, so PR runs never get write permissions.
name: build-test

on:
  workflow_call:
    inputs:
      no_cache:
        description: Rebuild with --pull --no-cache
        type: boolean
        default: false
    outputs:
      date_tag:
        value: ${{ jobs.image.outputs.date_tag }}
      short_sha:
        value: ${{ jobs.image.outputs.short_sha }}

permissions: {}

env:
  IMAGE_NAME: ghcr.io/codemastervy/smb-share-manager
  LOCAL_TAG: smb-share-manager:ci

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Frontend (typecheck + build, audit runtime dependencies)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm audit --omit=dev --audit-level=moderate
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: bandit
        run: uv run bandit -q -r src -c pyproject.toml
      - name: pip-audit (all locked dependencies, runtime and dev)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -q -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit -r "$RUNNER_TEMP/req.txt" --require-hashes --disable-pip --strict
      - name: unit and fuzz tests
        run: uv run pytest -q -W ignore::DeprecationWarning
      - name: file-operation tests on a loop-mounted exFAT filesystem
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs "linux-modules-extra-$(uname -r)"
          sudo modprobe exfat
          truncate -s 256M "$RUNNER_TEMP/exfat.img"
          mkfs.exfat "$RUNNER_TEMP/exfat.img"
          sudo mkdir -p /mnt/exfat-unit
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)",umask=0002 "$RUNNER_TEMP/exfat.img" /mnt/exfat-unit
          SSM_TEST_EXFAT_DIR=/mnt/exfat-unit uv run pytest -v -s -W ignore::DeprecationWarning \
            tests/unit/test_files.py 2>&1 | tee "$RUNNER_TEMP/exfat.log"
          mode=$(grep -o 'renameat2 native: [a-z]*' "$RUNNER_TEMP/exfat.log" | sort -u)
          echo "exFAT rename path: $mode" >> "$GITHUB_STEP_SUMMARY"
          sudo umount /mnt/exfat-unit

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      date_tag: ${{ steps.meta.outputs.date_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)-$short" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image (once)
        env:
          NO_CACHE: ${{ inputs.no_cache && '--pull --no-cache' || '--pull' }}
        run: |
          # shellcheck disable=SC2086
          docker build $NO_CACHE -f docker/Dockerfile -t "$LOCAL_TAG" \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg BUILD_DATE="${{ steps.meta.outputs.build_date }}" \
            --build-arg VCS_REF="${{ github.sha }}" .
          docker image inspect "$LOCAL_TAG" --format '{{.Id}}' | tee image-id.txt
          docker save "$LOCAL_TAG" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: |
            image.tar
            image-id.txt
          retention-days: 3

  integration:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fs: [exfat, ext4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load -i image.tar
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq smbclient exfatprogs "linux-modules-extra-$(uname -r)"
          sudo modprobe exfat
          uv sync --frozen
      - name: Integration tests (${{ matrix.fs }})
        run: scripts/ci/integration.sh "$LOCAL_TAG" "${{ matrix.fs }}"

  trivy:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
