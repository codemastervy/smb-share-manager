# Pushes the image that build-test.yml built and tested (the saved "image" artifact of the
# same run) to GHCR, then attaches an SBOM, build provenance and a cosign signature.
# Only called after build-test.yml succeeded in full.
name: push-image

on:
  workflow_call:
    inputs:
      date_tag:
        type: string
        required: true
      short_sha:
        type: string
        required: true

permissions: {}

env:
  IMAGE_NAME: ghcr.io/codemastervy/smb-share-manager
  LOCAL_TAG: smb-share-manager:ci

jobs:
  publish:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Load the tested image
        run: |
          docker load -i image.tar
          test "$(docker image inspect "$LOCAL_TAG" --format '{{.Id}}')" = "$(cat image-id.txt)"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact tested image
        id: push
        env:
          DATE_TAG: ${{ inputs.date_tag }}
          SHORT_SHA: ${{ inputs.short_sha }}
        run: |
          for tag in "sha-$SHORT_SHA" "$DATE_TAG" latest; do
            docker tag "$LOCAL_TAG" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done
          digest=$(docker image inspect "$IMAGE_NAME:latest" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
                   | grep "^$IMAGE_NAME@" | head -n1 | cut -d@ -f2)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE_NAME@$digest (tags: latest, $DATE_TAG, sha-$SHORT_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (cosign keyless)
        run: cosign sign --yes "$IMAGE_NAME@${{ steps.push.outputs.digest }}"
