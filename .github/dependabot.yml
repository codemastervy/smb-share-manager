# Weekly updates. Minor and patch updates are grouped into one PR per ecosystem and
# auto-merged after CI passes (see workflows/dependabot-automerge.yml). Major updates get
# their own PRs, labelled needs-review.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
