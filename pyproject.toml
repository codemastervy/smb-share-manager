[project]
name = "smb-share-manager"
version = "0.1.0"
description = "Small web UI for managing Samba shares and SMB users"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "argon2-cffi",
]

[project.scripts]
ssm-web = "ssm.web.main:main"
ssm-helper = "ssm.helper.server:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx",
    "smbprotocol",
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]  # subprocess use is deliberate and argv-only; reviewed in helper

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S104", "S603", "S607", "S608", "RUF001", "E501"]
"docker/**" = ["S310", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/fuzz"]
markers = [
    "linux: requires Linux-specific syscalls",
    "integration: requires the built container image",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]
